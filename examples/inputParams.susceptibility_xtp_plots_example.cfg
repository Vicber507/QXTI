[hamiltonian]
# Example: dedicated susceptibility sweep with all public controls in [xtp].
source_file = graphene.py

[kgrid]
dimension = 2
k_points = [21,21]

[timegrid]
dt = 1.0
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
omega = 0.061
E0 = 0.000049
ellip = 0.0
ncycles = 2.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# Run with:  python main.py examples/inputParams.susceptibility_xtp_plots_example.cfg -xtp
# Plot with: python qxti/graphics/graphics.py examples/inputParams.susceptibility_xtp_plots_example.cfg -xtp
# The solver parameters now live INSIDE [xtp] (no separate [susceptibility_solver]).
[xtp]
susceptibility_method = simulation
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_orders = [1]
# --- solver del barrido (antes [susceptibility_solver]) ---
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
# --- barrido ---
susceptibility_omega_values = [0.011024796652696497, 0.018374661087827496, 0.029399457740523993]
susceptibility_eps = 1.0e-14
susceptibility_plot_enabled = true
susceptibility_plot_output_dir = outputs/examples/xtp_susceptibility
susceptibility_plot_dataset_file = xtp_susceptibility.npz
susceptibility_plot_orders = [1]
susceptibility_plot_positive_only = false
susceptibility_plot_dpi = 300
susceptibility_plot_overview_enabled = true
susceptibility_plot_grid_enabled = true
susceptibility_plot_components_enabled = true
susceptibility_plot_conductivity_enabled = true
susceptibility_plot_ev_axis = true
