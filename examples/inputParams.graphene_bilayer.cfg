[hamiltonian]
source_file = graphene_bilayer.py
function_name = H

# Parametros del modelo en atomic units.
# Puedes sobreescribir cualquiera de los defaults del archivo en models/.
gamma0 = 0.11612765879227763
gamma1 = 0.014002219651108944
gamma3 = 0.013965470794151482
gamma4 = 0.005144821445127847
delta_prime = 0.0008084899416475189
u = 0.0

[hamiltonian_plots]
output_dir = outputs/graphene_bilayer
path_type = kx
plane = kx_ky
k_min = -0.25
k_max = 0.25
nk_path = 301
mesh_points = 101
surface_style = surface

[kgrid]
dimension = 2
k_points = [51, 51]

[timegrid]
dt = 0.05
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
omega = 0.8
E0 = 0.02
ellip = 0.0
ncycles = 1.2732395447351628
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[cmd]
enabled = false
