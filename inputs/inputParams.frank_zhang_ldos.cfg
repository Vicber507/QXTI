# ============================================================================
#  Frank-Zhang TaAs 8-band Weyl semimetal — LDOS de SUPERFICIE / ARCOS DE FERMI
#  Superficie (001) (normal = z): la decimacion de Lopez-Sancho da la Green
#  semi-infinita G_s(k_par, E). Los 8 nodos de Weyl (quiralidad +/-1, en el
#  plano kz = +/-4pi) proyectan sobre (kx, ky) en 8 puntos distintos con
#  quiralidad alternada -> arcos de Fermi que los conectan.
#  Unidades: E en unidades del hopping t=1 (adimensional); k adimensional.
#  Corre con:  python main.py inputs/inputParams.frank_zhang_ldos.cfg -ldos
# ============================================================================

[hamiltonian]
source_file   = frank_zhang_8band.py
function_name = H
# Parametros por defecto (fase de Weyl: el gap medio cierra a ~1e-4).
# nodos en (kx,ky)=(+/-0.991,+/-2.606) y (+/-2.606,+/-0.991), E_nodo ~ 0.029.
tp    = 1.0
lam   = 0.1
lamp  = 0.1
delta = 0.75
ani   = 1.2

[kgrid]
# Solo para la DOS de bulk de fondo (los mapas de superficie no la usan).
dimension = 3
k_points  = [31, 31, 31]
shifted   = true

[ldos]
enabled    = true
# --- Motor semi-infinito de SUPERFICIE (Lopez-Sancho) ---
method     = surface
broadening = lorentzian
# eta pequeno y FIJO: arcos finos pero visibles.  3e-3 (~0.08 eV) -> lineas
# continuas de arco sin difuminarlas en el continuo de bulk.
eta        = 3.0e-3

# La aprox. de capa-mas-cercana de la decimacion es EXACTA a lo largo de z
# (el modelo solo tiene e^{+-i kz/4}); por eso la superficie es la (001).
surface_normal   = z
surface_side     = top          # una terminacion -> un juego de arcos
surface_max_iter = 150
surface_tol      = 1.0e-9
surface_kn_points = 48          # capas via FT en kz (nearest-layer exacto -> basta poco)
surface_ldos_enabled = false    # integrar sobre la BZ 2D es caro y no hace falta
projected  = false

# --- Ventana / eje de energia (unidades de t) alrededor de los nodos ---
e_min = -0.40
e_max =  0.40
num_energies = 320
fermi_level  = 0.029            # E de los nodos de Weyl (referencia + E por defecto del corte)

# --- Mapa espectral de superficie 1: A_surf(k, E) sobre una linea ---
# Corte a lo largo de kx con ky = 2.606 (fijo): cruza los nodos proyectados
# en kx = +/-0.991 -> el estado de superficie (arco) une ambos a E ~ 0.029.
spectral_enabled     = true
spectral_axis        = kx
spectral_axis_origin = 0.0, 2.606, 0.0
spectral_axis_start  = -6.2832
spectral_axis_end    =  6.2832
spectral_num_k       = 400

# --- Mapa espectral de superficie 2: A_surf(kx, ky; E0) = corte tipo Fermi ---
# Este es el MAPA DE ARCOS DE FERMI: -Im Tr G_s/pi en (kx,ky) a E = E_nodo.
spectral_plane_enabled = true
spectral_plane_energy  = 0.029
spectral_plane_kx_min  = -6.2832
spectral_plane_kx_max  =  6.2832
spectral_plane_ky_min  = -6.2832
spectral_plane_ky_max  =  6.2832
spectral_plane_nkx     = 200
spectral_plane_nky     = 200

# --- Estilo de los mapas ---
spectral_cmap      = Blues
spectral_log_scale = true
# rango log ajustado al peso REAL de los estados de superficie (A~0.3..25):
spectral_log_vmin  = -0.6
spectral_log_vmax  =  1.4
plot_dpi = 300
