# =============================================================================
# INPUT UNIFICADO: bicapa de grafeno (apilamiento AB). Un solo archivo, dos
# modos (flag en main.py):
#   python main.py inputs/inputParams.graphene_bilayer.cfg -hhg   -> [cmd],[laser]
#   python main.py inputs/inputParams.graphene_bilayer.cfg -xtp   -> [xtp]
# Salidas: outputs/graphene_bilayer/cmd y outputs/graphene_bilayer/xtp.
#   python qxti/graphics/graphics.py inputs/inputParams.graphene_bilayer.cfg
# =============================================================================

[hamiltonian]
source_file = graphene_bilayer.py
# Parametros del modelo en atomic units.
stacking = AB
a0 = 4.6479
gamma0 = 0.11612765879227763
gamma1 = 0.014002219651108944
gamma3 = 0.013965470794151482
gamma4 = 0.005144821445127847
delta_prime = 0.0008084899416475189
u = 0.002800296934373094

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
dimension = 2
k_points = [61, 61]
shifted = true

[timegrid]
dt = 0.3
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
omega = 0.061
E0 = 0.000049
ellip = 0.0
ncycles = 12.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# ─── Modo -hhg ───────────────────────────────────────────────────────────────
[cmd]
# response_method: simulation | theory | both. Timer con ETA.
response_method = simulation
enabled = true
max_order = 3
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
dataset_time_stride = 64
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
n_workers = 0

# ─── Modo -xtp ───────────────────────────────────────────────────────────────
[susceptibility_solver]
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
n_workers = 0

[xtp]
# susceptibility_method: simulation | theory | both.
susceptibility_method = simulation
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_orders = [1]
susceptibility_omega_min = 0.030
susceptibility_omega_max = 0.100
susceptibility_num_frequencies = 20
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
