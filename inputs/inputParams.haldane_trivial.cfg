# =============================================================================
# INPUT UNIFICADO: modelo de Haldane en la fase TRIVIAL (Chern = 0).
# Criterio: |M0| > 3*sqrt(3)*t2*sin(phi0). Para t2=0.025, phi0=1.16:
# M_critico = 0.1191 a.u.; aqui M0=0.175 (fase trivial). Se mantienen t1,t2,phi0
# iguales al input topologico para comparar directamente. Un solo archivo, dos
# modos (flag en main.py):
#   python main.py inputs/inputParams.haldane_trivial.cfg -hhg  -> [cmd],[laser]
#   python main.py inputs/inputParams.haldane_trivial.cfg -xtp  -> [xtp]
# Salidas: outputs/haldane_trivial/cmd y .../xtp.
#   python qxti/graphics/graphics.py inputs/inputParams.haldane_trivial.cfg
# =============================================================================

[hamiltonian]
source_file = haldane.py
t1 = 0.075
t2 = 0.025
phi0 = 1.16
M0 = 0.175
a0 = 1.8897268777743552

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
dimension = 2
k_points = [81, 81]
shifted = true

[timegrid]
dt = 0.08
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
omega = 0.09
E0 = 0.00035
ellip = 0.0
ncycles = 10.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# ─── Modo -hhg ───────────────────────────────────────────────────────────────
[cmd]
# response_method: simulation | theory | both. Timer con ETA.
response_method = theory
enabled = true
max_order = 3
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
dataset_time_stride = 64
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
n_workers = 0

# ─── Modo -xtp ───────────────────────────────────────────────────────────────
[susceptibility_solver]
max_order = 2
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
n_workers = 0

[xtp]
# susceptibility_method: simulation | theory | both.
susceptibility_method = theory
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_orders = [1,2]
# Mismo barrido que el input topologico para comparar.
susceptibility_omega_min = 0.005
susceptibility_omega_max = 0.180
susceptibility_num_frequencies = 61
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
