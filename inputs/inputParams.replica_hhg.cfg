# =============================================================================
# INPUT UNIFICADO: semimetal de Weyl de dos bandas (4 nodos, modelo 3D tipo
# TaAs). Un solo archivo, dos modos (flag en main.py):
#   python main.py inputs/inputParams.wsm.cfg -cmd   -> [cmd],[laser]
#   python main.py inputs/inputParams.wsm.cfg -xtp   -> [xtp] (tensor 3x3)
# Salidas: outputs/wsm/cmd y outputs/wsm/xtp.
#   python qxti/graphics/graphics.py inputs/inputParams.wsm.cfg
# =============================================================================

[hamiltonian]
source_file = wsm_two_weyl.py
function_name = H
# Parametros en atomic units. gamma = tilt; tx,ty,tz = hoppings; M0 = masa.
# M0 y a2: mejores parametros de la replica del 4to armonico (paper TaAs).
# Originales TaAs cubico: M0 = 0.0164, a2 = 6.4250683612 (= a0).
gamma = 0.0
tx = 0.0041
ty = 0.0082
tz = 0.0082
M0 = 0.014
a2 = 12.0
# kw (posicion del nodo de Weyl) = pi/(2 a0) si no se da.

[hamiltonian_plots]
path_type = kx
plane = kx_kz
k_min = -0.45
k_max = 0.45
nk_path = 301
mesh_points = 81

[kgrid]
# Modelo 3D -> Nk = Nx*Ny*Nz crece rapido. shifted = true IMPRESCINDIBLE: evita
# que el grid caiga sobre los 4 nodos de Weyl (gap=0, Berry singular).
dimension = 3
k_points = [6, 6, 6]
shifted = true

[timegrid]
dt = 0.8
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
# Escalas del WSM: hoppings ~0.008, gap maximo ~0.08. Campo debil (perturbativo).
omega = 0.0114
E0 = 0.0013
ellip = 0.0
ncycles = 8.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# ─── Modo -cmd ───────────────────────────────────────────────────────────────
[cmd]
# response_method: pfddm(=theory,mesh) | ptddm(=simulation,CMD) | tddm(full non-pert.) | both | all
response_method = simulation
enabled = true
max_order = 8
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
n_workers = 0

# ─── Modo -xtp ───────────────────────────────────────────────────────────────
[xtp]
# susceptibility_method: pfddm | ptddm | tddm | both | all (old theory/simulation = aliases)
susceptibility_method = pfddm
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1
susceptibility_enabled = true
susceptibility_orders = [1]
susceptibility_omega_min = 0.004
susceptibility_omega_max = 0.060
susceptibility_num_frequencies = 30
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14

# --- Solver del barrido (antes en la seccion [susceptibility_solver], ahora
#     PARTE de [xtp]). Construye rho^(s) en memoria para chi/sigma; el barrido
#     en frecuencia se configura con las claves susceptibility_* de arriba.
#     max_order debe ser >= max(susceptibility_orders). ---
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00

# ─── Modo -ldos: densidad de estados g(E), PDOS y funcion espectral A(k,E) ───
[ldos]
# Todas las entradas de [ldos] usan unidades atomicas: E en Hartree y k en 1/Bohr.
# DOS ~ E^2 cerca de los nodos de Weyl (3D).
# Modos disponibles:
#   eigenvalues = bulk periodico: DOS/PDOS y A(k,E)
#   surface     = semi-infinito por una direccion (Lopez-Sancho).
#                 surface_side=both da las DOS caras a la vez (p.ej.
#                 TODOS los arcos de Fermi de un WSM, o ambos bordes en 2D).
#   finite      = placa finita en dos direcciones: sin buen k; devuelve
#                 DOS finita, espectro finito y LDOS(r,E)
enabled = true
# method: eigenvalues (diagonaliza H(k) y ensancha; = traza de Green -Im Tr G/pi).
method = eigenvalues
# broadening: lorentzian (DOS de Green exacto; metales/semimetales) |
#             gaussian (AISLANTES con gap: evita que las colas ~1/d^2 lo rellenen).
broadening = lorentzian
# eta = 0 -> automatico (unos pocos pasos de la malla de energia). >0 fija el ancho (a.u.).
eta = 0.0

# --- Estados de SUPERFICIE / BORDE (pon method = surface arriba) ---
# Hace el cristal semi-infinito en una direccion (decimacion de Lopez-Sancho) y
# calcula la funcion de Green de superficie -> revela estados de SUPERFICIE (3D)
# o de BORDE (2D, p.ej. el modo quiral de Haldane) en el gap proyectado del bulk.
# El momento de la superficie son las direcciones NO normales; el camino/plano
# espectral se interpretan en ese sub-espacio.
surface_normal       = auto      # x|y|z|auto (z en 3D, y en 2D)
surface_kn_points    = 200       # muestreo de Fourier a lo largo de la normal
surface_max_iter     = 80        # iteraciones de la decimacion de Sancho
surface_tol          = 1.0e-8
surface_ldos_enabled = true      # ademas integra A_surf -> LDOS de superficie g_surf(E)
## ahora actua como slab finito y muestra las dos superficies opuestas a la vez.

# --- Placa finita 2D (pon method = finite arriba; actualmente 2D Haldane) ---
finite_nx = 24
finite_ny = 24
finite_edge_cells = 1
finite_ldos_energy = 0.0

# --- Eje / ventana de energia (a.u.) ---
# Vacias e_min/e_max -> auto desde los extremos de banda. Fijarlas acota el EJE
# de energia de TODAS las graficas (DOS, PDOS y mapas espectrales).
# e_min = -0.30
# e_max =  0.30
num_energies = 600

# --- PDOS proyectada por orbital/subred (suma_alpha g_alpha = g) ---
projected = true
fermi_level = 0.0          # nivel de Fermi (a.u.): linea de referencia

# --- Funcion espectral A(k,E), modo 1: E vs k ---
# El camino se define (prioridad arriba->abajo):
#   (a) spectral_path: vertices de alta simetria (multi-segmento) + etiquetas;
#   (b) spectral_k0/spectral_k1: un unico segmento recto;
#   (c) por defecto: linea recta a lo largo de kx cruzando la caja de la BZ.
# OJO: el camino NO se recorta a la caja; H(k) es periodico, asi que puede pasar
# por las esquinas REALES de la BZ (p.ej. los puntos de Dirac K, fuera de la caja).
# Todas esas coordenadas van en a.u.; el grafico las convierte a 1/Ang.
spectral_enabled = true
# spectral_path = 0,0,0 ; 0.3,0,0 ; 0.2,0.2,0   # vertices ; coords
# spectral_path_labels = \Gamma, X, M
# (sin spectral_path: usa spectral_k0/k1, o por defecto una linea kx)
spectral_num_k = 300
# Alternativa de un solo segmento (si no usas spectral_path):
# spectral_k0 = -0.5, 0.0, 0.0
# spectral_k1 =  0.5, 0.0, 0.0

# --- Funcion espectral, modo 2: kx-ky a energia fija (corte tipo Fermi) ---
spectral_plane_enabled = true
# spectral_plane_energy = 0.0   # plano kx-ky a kz fijo (abajo)
spectral_plane_kz  = 0.0
# Ventana del plano (a.u.). Vacias -> auto desde la caja de la BZ.
# spectral_plane_kx_min = -1.3
# spectral_plane_kx_max =  1.3
# spectral_plane_ky_min = -1.3
# spectral_plane_ky_max =  1.3
spectral_plane_nkx = 200
spectral_plane_nky = 200

# --- Estilo de los mapas espectrales (como el ejemplo original) ---
spectral_cmap       = Blues      # cualquier colormap de matplotlib
spectral_log_scale  = true       # log10 del peso espectral
spectral_log_vmin   = -1.5       # rango de color fijo (vacio -> auto)
spectral_log_vmax   = 3.3
spectral_alpha_min  = 0.0        # transparencia lineal (0=transparente)
spectral_alpha_max  = 1.0

# --- Salida de figuras (siempre en eV vs 1/Ang) ---
plot_dpi = 300
