[hamiltonian]
# Dedicated susceptibility sweep for bilayer graphene.
#
# 1. Generate the data (the sweep):
#   .venv/bin/python main.py inputParams.graphene_bilayer.susceptibility.cfg
# 2. Generate the chi/sigma plots from the saved dataset:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.graphene_bilayer.susceptibility.cfg --family susceptibility
source_file = graphene_bilayer.py

stacking = AB
a0 = 4.6479
gamma0 = 0.11612765879227763
gamma1 = 0.014002219651108944
gamma3 = 0.013965470794151482
gamma4 = 0.005144821445127847
delta_prime = 0.0008084899416475189
u = 0.002800296934373094

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
dimension = 2
# PRECISION: use ODD counts per axis to activate Simpson 1/3 integration (O(h^4)).
k_points = [41, 41]

[timegrid]
dt = 1.0
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
# omega and Cartesian probe direction are overridden by the dedicated sweep.
omega = 0.061
E0 = 0.000049
ellip = 0.0
ncycles = 4.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[susceptibility_solver]
# This section is used only for the in-memory solver parameters needed to build
# susceptibility. In this special workflow no rho_order_*.npy files and no CMD
# datasets are written to disk, so this is not a normal [cmd] block. The sweep
# itself is configured from [xtp].
max_order = 3
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
# Parallel k-loop: 0 = use all available CPU cores automatically.
n_workers = 0

[xtp]
# ─── MOTOR DE CALCULO ─────────────────────────────────────────────────────
# Elige como se calcula la respuesta optica:
#   simulation = CMD en el dominio del tiempo (pulso + FFT). Exacto, mas lento.
#   theory     = formula analitica de Kubo/Hipolito en frecuencia. Mucho mas
#                rapido (un solo barrido del grid k, sin propagacion temporal).
#   both       = corre ambos, los guarda por separado y reporta el speedup.
# Ambos motores muestran un timer con ETA mientras corren.
susceptibility_method = simulation
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_output_dir = outputs/susceptibility_graphene_bilayer
# chi^(1) is reconstructed as a full Cartesian tensor from x/y(/z) probes.
# For order > 1 this runner stores the repeated-input-axis slices
# chi^(n)_{i j...j}(n omega; omega, ..., omega) from pure Cartesian pumps.
susceptibility_orders = [1]
susceptibility_omega_min = 0.030
susceptibility_omega_max = 0.100
susceptibility_num_frequencies = 20
# Paralelizacion del barrido con procesos (0 = auto por RAM/nucleos, exacto).
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
