[hamiltonian]
# Dedicated input for susceptibility-vs-laser-frequency sweeps.
#
# 1. Generate the data (the sweep):
#   .venv/bin/python main.py inputParams.susceptibility.cfg
# 2. Generate the chi/sigma plots from the saved dataset:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.susceptibility.cfg --family susceptibility
#   (or python qxti/graphics/plot_susceptibility_tensor.py inputParams.susceptibility.cfg)
#
# main.py detects [xtp] susceptibility_enabled = true automatically and
# switches to the dedicated laser-frequency workflow for this special input.
source_file = graphene.py

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
dimension = 2
# Dedicated tensor sweeps are much more expensive than one normal run because
# the code repeats the simulation for every omega_laser and every Cartesian probe.
# 31x31 is a practical compromise for a full chi^(1)(omega) sweep.
# PRECISION: use ODD counts per axis to activate Simpson 1/3 integration (O(h^4)).
k_points = [101, 101]

[timegrid]
# dt = 1.0 keeps the low-energy tail from exploding in cost.
dt = 0.2
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
# The dedicated sweep overrides omega and uses internal pure x/y probes to
# reconstruct chi_xx^(1), chi_xy^(1), chi_yx^(1) and chi_yy^(1).
# The remaining pulse parameters below are reused for every sweep point.
# Note: for pristine monolayer graphene, chi_xy and chi_yx are expected to stay
# very close to zero by symmetry; changing only the laser here does not make
# them physically finite.
omega = 0.061
E0 = 0.00035
ellip = 0.0
# Keep the pulse short enough that the 0.05 eV point is still tractable.
ncycles = 8.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[susceptibility_solver]
# This section is used only for the in-memory solver parameters needed to build
# susceptibility. In this special workflow no rho_order_*.npy files and no CMD
# datasets are written to disk, so this is not a normal [cmd] block. The sweep
# itself is configured from [xtp].
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
# Parallel k-loop: 0 = use all available CPU cores automatically.
n_workers = 0

[xtp]
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
# Dedicated XTP susceptibility sweep.
susceptibility_enabled = true
susceptibility_output_dir = outputs/susceptibility_graphene
# Linear tensor only. In 2D graphene this reconstructs the 4 components:
#   chi_xx^(1), chi_xy^(1), chi_yx^(1), chi_yy^(1)
susceptibility_orders = [1]
# Exact omega = 0 is not suitable in this time-domain pulse workflow.
# We sweep from 0.05 eV to 1.2 eV with 40 samples.
# 0.05 eV = 0.0018374661087827496 a.u.
# 1.20 eV = 0.04409918661078599 a.u.
susceptibility_omega_min = 0.011
susceptibility_omega_max = 0.110
susceptibility_num_frequencies = 50
# Paralelizacion del barrido de frecuencias con PROCESOS (no threads).
# Cada frecuencia se resuelve en un proceso independiente (sin GIL), dando
# speedup ~N_nucleos. Resultados IDENTICOS al modo serial (sin perdida de
# precision). Permite barridos mas finos y grids mas grandes.
#   0 = automatico (limitado por RAM y numero de nucleos) [RECOMENDADO]
#   1 = serial (sin paralelizar)
#   N = N procesos explicitos
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14

