[hamiltonian]
# Comparacion teoria vs simulacion para sigma^(1)(omega), modelo QWZ red cuadrada
# (BZ exacta = [-pi,pi]^2). susceptibility_method elige el motor:
#   simulation = CMD time-domain (exacto, lento)
#   theory     = Kubo analitico (rapido)
#   both       = ambos + reporte de tiempos
source_file = square_2band.py

[kgrid]
dimension = 2
k_points = [21, 21]
shifted = true

[timegrid]
dt = 0.1
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
omega = 3.0
E0 = 0.0001
ellip = 0.0
ncycles = 20.0
cep = 0.0
t0 = 0.0
envname = gauss

[susceptibility_solver]
max_order = 1
population_time = 1.0e9
coherence_time = 4.0
temperature = 0.001
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
n_workers = 0

[xtp]
bz_mask_enabled = false
susceptibility_enabled = true
susceptibility_method = both
susceptibility_output_dir = outputs/qwz_compare
susceptibility_orders = [1]
susceptibility_omega_min = 1.0
susceptibility_omega_max = 5.0
susceptibility_num_frequencies = 12
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
