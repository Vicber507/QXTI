[hamiltonian]
# Dedicated susceptibility sweep for the Haldane model in the Chern phase.
# Run with:
#   .venv/bin/python main.py inputParams.haldane_topological.susceptibility.cfg
#
# Criterion:
#   |M0| < 3*sqrt(3)*t2*sin(phi0)
# For t2 = 0.025 a.u. and phi0 = 1.16 rad:
#   M_critical = 0.11909621736973472 a.u.
#
# This file keeps the default Haldane parameters and therefore lies in the
# topological phase with opposite Dirac masses at K and K'.
source_file = haldane.py
t1 = 0.075
t2 = 0.025
phi0 = 1.16
M0 = 0.0635
a0 = 1.8897268777743552

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -1.10
k_max = 1.10
mesh_points = 101

[kgrid]
dimension = 2
# Moderate but still reasonably resolved mesh for a first chi^(1)(omega) sweep.
k_points = [91,91]

[timegrid]
# The Haldane gap is a few eV for these parameters, so dt can be tighter than
# in the low-energy graphene examples without becoming too expensive.
dt = 0.1
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
# The dedicated sweep overrides omega and uses internal pure x/y probes to
# reconstruct chi_xx^(1), chi_xy^(1), chi_yx^(1), chi_yy^(1).
omega = 0.060
E0 = 0.000049
ellip = 0.0
ncycles = 12.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[susceptibility_solver]
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
# Parallel k-loop: 0 = use all available CPU cores automatically.
n_workers = 0

[xtp]
# ─── MOTOR DE CALCULO ─────────────────────────────────────────────────────
# Elige como se calcula la respuesta optica:
#   simulation = CMD en el dominio del tiempo (pulso + FFT). Exacto, mas lento.
#   theory     = formula analitica de Kubo/Hipolito en frecuencia. Mucho mas
#                rapido (un solo barrido del grid k, sin propagacion temporal).
#   both       = corre ambos, los guarda por separado y reporta el speedup.
# Ambos motores muestran un timer con ETA mientras corren.
susceptibility_method = theory
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_output_dir = outputs/susceptibility_haldane_topological
susceptibility_orders = [1]
# Sweep chosen to cover below-gap and above-gap response.
# 0.005 a.u. = 0.136 eV
# 0.180 a.u. = 4.898 eV
susceptibility_omega_min = 0.005
susceptibility_omega_max = 0.180
susceptibility_num_frequencies = 61
# Paralelizacion del barrido con procesos (0 = auto por RAM/nucleos, exacto).
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
