[hamiltonian]
# Barrido de susceptibilidad y conductividad vs frecuencia del laser para el
# semimetal de Weyl de dos bandas (modelo 3D tipo TaAs).
#
# 1. Generar los datos (el barrido):
#   .venv/bin/python main.py inputParams.wsm.susceptibility.cfg
# 2. Generar los plots de chi y sigma:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.wsm.susceptibility.cfg --family susceptibility
#   (o python qxti/graphics/plot_susceptibility_tensor.py inputParams.wsm.susceptibility.cfg)
#
# Como el modelo es 3D, los probes cartesianos son x, y, z y el tensor chi^(1)
# (y sigma^(1)) es 3x3 (9 componentes).
source_file = wsm_two_weyl.py
function_name = H

# Parametros del modelo en atomic units (sobreescriben los defaults).
gamma = 0.0
tx = 0.0041
ty = 0.0082
tz = 0.0082
M0 = 0.0164

[hamiltonian_plots]
output_dir = outputs/wsm_susceptibility
path_type = kx
plane = kx_kz
k_min = -0.45
k_max = 0.45
mesh_points = 81

[kgrid]
dimension = 3
# El barrido repite el solve para cada frecuencia y cada direccion cartesiana,
# asi que en 3D es caro. Se modesto con el grid. 11x11x11 = 1331 puntos.
k_points = [11, 11, 11]
# shifted = true es imprescindible: evita que el grid caiga sobre los nodos de
# Weyl (gap=0), donde la conexion de Berry es singular.
shifted = true

[timegrid]
# dt resuelve el ancho de banda (~0.08 a.u.); el integrador exponencial trata
# las oscilaciones de banda de forma exacta, asi que dt=2.0 es holgado.
dt = 1.0
# blackman da el piso de fugas mas bajo (mejor para resonancias agudas de chi).
fft_window = blackman
zero_padding = true
# Padding alto reduce el jitter de muestreo de chi (es barato, solo mas FFT).
padding_factor = 8

[laser]
# El barrido sobreescribe omega y la direccion; el resto se reutiliza en cada
# punto. Campo debil para mantener la respuesta lineal (orden 1).
omega = 0.01
E0 = 0.00013
ellip = 0.0
# ncycles controla la resolucion FFT del muestreo de chi(omega).
# Mas ciclos = muestreo mas preciso pero barrido mas caro.
ncycles = 6.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[susceptibility_solver]
# Parametros del solver en memoria para construir chi/sigma. En este flujo no se
# escriben rho_order_*.npy ni datasets de CMD a disco; el barrido se configura
# desde [xtp]. max_order = 1 -> tensor lineal chi^(1)_ij y sigma^(1)_ij (3x3).
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00

[xtp]
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1

# Barrido dedicado de susceptibilidad/conductividad.
susceptibility_enabled = true
susceptibility_output_dir = outputs/wsm_susceptibility
# Tensor lineal (orden 1). En 3D reconstruye las 9 componentes chi^(1)_ij.
susceptibility_orders = [1]
# Barrido de omega_laser que cubre las transiciones del WSM (gap maximo ~0.08).
# Se evita omega = 0 (no es valido en este flujo de pulsos en el tiempo).
susceptibility_omega_min = 0.004
susceptibility_omega_max = 0.060
susceptibility_num_frequencies = 30
# Paralelizacion del barrido con PROCESOS: cada frecuencia en un proceso
# independiente (sin GIL) -> speedup ~N_nucleos. Resultados identicos al serial.
# CLAVE para que un barrido 3D sea viable en tiempo razonable.
#   0 = automatico (limitado por RAM y nucleos) [RECOMENDADO]
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14

# Los plots de chi y sigma se generan aparte (flujo uniforme con el resto):
#   python qxti/graphics/graphics.py inputParams.wsm.susceptibility.cfg --family susceptibility
# graphics usa defaults sensatos (overview, grid, componentes y conductividad).
