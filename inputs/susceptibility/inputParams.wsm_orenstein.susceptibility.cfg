[hamiltonian]
# Barrido de susceptibilidad/conductividad vs frecuencia para el WSM de
# Wu/Orenstein 2016 (modelo 4x4, 4 nodos de Weyl, rompe inversion con Delta).
#
# Este modelo se construyo para explicar la respuesta SHG (chi^(2)) gigante de
# TaAs. Por eso el barrido usa orden 2 (susceptibility_orders = [2]); las
# componentes interesantes del paper son chi_zzz y chi_xzx (Fig. 4d).
#
# 1. Generar los datos (el barrido):
#   .venv/bin/python main.py inputParams.wsm_orenstein.susceptibility.cfg
# 2. Generar los plots de chi y sigma (eje en eV):
#   .venv/bin/python qxti/graphics/graphics.py inputParams.wsm_orenstein.susceptibility.cfg --family susceptibility
source_file = wsm_orenstein.py
function_name = H

# Parametros del paper (Fig. 4d): t=0.8 eV, Delta=0.5, mz=5, my=1.
t = 0.0294
my = 1.0
mz = 5.0
Delta = 0.5
a = 1.0

[hamiltonian_plots]
output_dir = outputs/wsm_orenstein_susceptibility
path_type = kx
plane = kx_ky
k_min = -3.14159
k_max = 3.14159
mesh_points = 81

[kgrid]
dimension = 3
# 3D de 4 bandas + orden 2 -> MUY caro (repite el solve por frecuencia y por
# direccion). Se modesto con el numero de puntos.
#
# Ya NO hay que elegir N "a mano" para evitar degeneraciones: el guard
# automatico (auto_degeneracy_guard = true, por defecto) escanea el gap de
# banda y, si el grid cae sobre un punto de toque de bandas (nodo de Weyl,
# degeneracion de espin en pi/2, punto Gamma, ...), reconstruye un grid
# Monkhorst-Pack simetrico ajustando el conteo al valor limpio mas cercano.
# Asi cualquier N da una respuesta que respeta las simetrias del cristal.
#
# MEMORIA (importante en 16 GB): el coste bruto escala como Nk * Nt * Nb^2.
# El barrido dedicado ya no intenta sostener una frecuencia completa en RAM:
# usa rho temporal en disco por frecuencia/direccion para que corridas grandes
# no se autodestruyan por OOM. Sigue habiendo un trade-off grid <-> rango de
# frecuencia porque el scratch temporal y la cache del SO pueden crecer mucho:
#   - 8^3  + rango completo 0.3-3 eV  -> ~6.7 GiB/freq (este config).
#   - 12^3 + rango recortado 0.8-3 eV -> ~4.7 GiB/freq (sube k_points=[12,12,12]
#     y susceptibility_omega_min=0.030).
# 8^3 es limpio para este WSM (multiplo de 4). Con mas RAM sube a 12^3/16^3/20^3.
k_points = [60, 60, 60]
shifted = true

[timegrid]
# Ancho de banda ~0.76 a.u.; el integrador exponencial es exacto en banda, asi
# que dt=1.5 es de sobra (Nyquist >> 2*omega_max). dt mayor y padding menor
# reducen Nt (= numero de pasos = memoria) sin perder fisica.
dt = 0.1
fft_window = blackman
zero_padding = true
padding_factor = 2

[laser]
# El barrido sobreescribe omega y la direccion. Campo debil.
omega = 0.02
E0 = 0.0003
ellip = 0.0
# Mas ciclos -> mejor muestreo de chi(omega) pero pulso mas largo (mas memoria).
# 4 ciclos resuelve chi(omega) a la escala del espaciado del barrido.
ncycles = 12.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[susceptibility_solver]
# Orden 2 -> tensor chi^(2)_ijk (SHG). max_order = 2.
max_order = 2
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00

[xtp]
susceptibility_method = theory
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1

# Barrido dedicado de susceptibilidad/conductividad de orden 2 (SHG).
susceptibility_enabled = true
susceptibility_output_dir = outputs/wsm_orenstein_susceptibility
# Orden 2: tensor chi^(2). En 3D, las componentes de eje repetido por direccion.
susceptibility_orders = [1,2]
# Barrido de omega_laser. El paper grafica chi vs energia del foton hasta ~3 eV.
# 0.3 eV = 0.011 a.u.,  3.0 eV = 0.110 a.u.  (rango completo del paper)
# omega_min mas bajo = pulsos mas largos = mas memoria (domina el coste). Si no
# cabe, subelo (0.020 = 0.54 eV) o reduce el grid.
susceptibility_omega_min = 0.0011
susceptibility_omega_max = 0.110
susceptibility_num_frequencies = 151
# Paralelizacion del barrido:
#   0 = modo estable por defecto: serial con scratch temporal
#   N > 0 = fuerza N procesos en paralelo si quieres mas velocidad
# Para grids altos conviene dejarlo en 0 o 1.
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
