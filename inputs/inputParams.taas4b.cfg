# =============================================================================
# TaAs tight-binding (8 bandas, spinful, grupo espacial I4_1md / C4v).
# Corre la susceptibilidad de 2do orden chi^(2) (componente zzz, el eje polar C4).
#
#   python main.py inputs/inputParams.taas_tb.cfg -xtp
#
# El modelo (models/taas_tb.py) trabaja en eV/Angstrom; el wrapper H convierte a
# atomic units (energias en Hartree, k en 1/Bohr). BZ = box tetragonal convencional
# (aprox. de la BCT); las frecuencias/resonancias son fisicas, la magnitud absoluta
# es ilustrativa. Parametros del modelo = ilustrativos (fase de semimetal de Weyl).
# =============================================================================

[hamiltonian]
source_file = taas_4band.py
function_name = H

[hamiltonian_plots]
path_type = kz
plane = kx_kz
k_min = -0.45
k_max = 0.45
nk_path = 201
mesh_points = 41

[kgrid]
# BZ = [-pi/a, pi/a]^2 x [-pi/c, pi/c] (a.u.) leida del modelo (BZaxis).
# shifted = true: evita caer sobre los nodos de Weyl (gap=0, conexion de Berry singular).
# Menos puntos en z (la BZ es mas corta en kz: c >> a).
dimension = 3
k_points = [121, 121, 121]
shifted = true

[timegrid]
dt = 0.1
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
# (No se usa para -xtp; requerido por el parser. Escala tipo eV.)
omega = 0.02
E0 = 1.0e-3
ellip = 0.0
ncycles = 12.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# ─── Modo -cmd ───────────────────────────────────────────────────────────────
[cmd]
# response_method: pfddm(=theory,mesh) | ptddm(=simulation,CMD) | tddm(full non-pert.) | both | all
response_method = pfddm
enabled = true
max_order = 7
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
# tddm time integrator (velocity-gauge von Neumann): cfm2 (unitary, DEFAULT) | rkf45 | ab2  -- see docs/INTEGRATORS.md
tddm_propagator = cfm2
save_frequency_domain = false
n_workers = 0
reserve_gb = 1.0

[xtp]
# Metodo analitico (rapido, sin propagar en el tiempo).
susceptibility_method = pfddm
susceptibility_enabled = true
# Orden 2 -> chi^(2)_{ijk}(2w); extraemos la componente zzz.
susceptibility_orders = [2]
# Rango de frecuencia (a.u.). Bandas ~[-0.4,1.4] eV -> transiciones ~0.2-1.8 eV.
# w de 0.14 a 1.6 eV (salida a 2w). 1 eV = 0.036749 a.u.
susceptibility_omega_min = 0.005
susceptibility_omega_max = 0.060
susceptibility_num_frequencies = 25
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14
bz_mask_enabled = false

# --- Solver / ocupacion para construir rho^(s) ---
max_order = 2
# T1 = inf (omitido). T2 = coherencia (broadening). gamma = 1/T2 ~ 27 meV.
coherence_time = 1000
temperature = 0.001
fermi_level = 0.0
# Semimetal de Weyl a neutralidad: llena las 4 bandas mas bajas de 8.
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
