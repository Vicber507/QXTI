# =============================================================================
# Bi2Se3 (superficie) — BOMBEO BICIRCULAR omega : 2omega contrarrotante.
#
# Potencial vector objetivo (a.u.):
#   A(t) = A1 [ cos(wt) x + sin(wt) y ] + A2 [ -cos(2wt+phi) x + sin(2wt+phi) y ]
#   con A1 = E0/w,  A2 = ratio*E0/(2w)   y   ratio = 2  ->  A2 = E0/w = A1
#   (POTENCIALES VECTORES IGUALES).  E = -dA/dt  ->  |E1| = E0,  |E2| = ratio*E0 = 2*E0
#   (el segundo armonico tiene el DOBLE de campo).
#
# Parametros fisicos pedidos:
#   w  = 0.2 eV  = 0.0073498642 a.u.
#   E0 = 1 MV/cm = 1.944690e-4 a.u.   (unidad de campo = 5.14220674e9 V/cm)
#
# Mapeo a QXTI (verificado numericamente, pulso a pulso, a maquina):
#   Circular en QXTI -> ellip = +/-1, con |E| = E0_qxti / sqrt(2).
#   |E1| = E0    -> E0_qxti(pulso1) = sqrt(2)*E0        = 2.750208e-4
#   |E2| = 2*E0  -> E0_qxti(pulso2) = sqrt(2)*ratio*E0  = 5.500415e-4   (ratio=2)
#   Pulso 1 (w,  helicidad +): ellip=+1, cep = +pi/2       = +1.5707963268
#   Pulso 2 (2w, helicidad -): ellip=-1, cep = -(phi+pi/2)
#     -> phi es el DESFASE entre pulsos. Aqui phi=0  ->  cep2 = -pi/2 = -1.5707963268.
#        Para otro phi: cep2 = -(phi + 1.5707963268).
#   ncycles del 2w = 2x el del w  (misma DURACION temporal de la envolvente gauss).
#
#   python main.py inputs/inputParams.bi2se3_bicircular.cfg -cmd
#   python qxti/graphics/graphics.py inputs/inputParams.bi2se3_bicircular.cfg
# =============================================================================

[hamiltonian]
source_file = bi2se3_surface.py
a0   = 7.8234655927
A0   = -0.000937
B0   = 0.00060
A11  = 0.00711836
A12  = 0.00823187
A14  = 0.00202489
B11  = 0.00442095
B14  = 0.0

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
dimension = 2
k_points = [61, 61]
shifted = true

[timegrid]
dt = 2.0
fft_window = blackman
zero_padding = true
padding_factor = 4

# ─── DOS pulsos: bombeo bicircular w : 2w contrarrotante ──────────────────────
[laser]
pulses = [
    {"omega": 0.0073498642, "E0": 0.0002750208, "ellip":  1.0, "cep":  1.5707963268, "ncycles":  6.0, "t0": 0.0, "envname": "gauss"},
    {"omega": 0.0146997285, "E0": 0.0005500415, "ellip": -1.0, "cep": -1.5707963268, "ncycles": 12.0, "t0": 0.0, "envname": "gauss"},
    ]

# ─── Modo -cmd ───────────────────────────────────────────────────────────────
[cmd]
# tddm = solve no-perturbativo completo (recomendado para un bombeo fuerte y
# multi-frecuencia; velocity gauge, liviano en memoria). Cambia a ptddm si quieres
# ver poblaciones/coherencias de rho(k,t) (save_population_dataset/coherence).
response_method = tddm
# tddm time integrator (velocity-gauge von Neumann): cfm2 (unitary, DEFAULT) | rkf45 | ab2  -- see docs/INTEGRATORS.md
tddm_propagator = cfm2
enabled = true
max_order = 5
population_time = 1000
coherence_time = 2000
temperature = 0.01
fermi_level = 0.0
distribution = fermi_dirac
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
n_workers = 0
save_population_dataset = false
save_coherence_dataset = false
dataset_time_stride = 64

[xtp]
susceptibility_enabled = false

[ldos]
enabled = false
