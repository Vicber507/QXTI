# =============================================================================
# INPUT UNIFICADO: WSM de Wu/Orenstein 2016 (modelo 4x4 con spin, 4 nodos de
# Weyl, rompe inversion con Delta -> SHG gigante de TaAs). Un solo archivo, dos
# modos (flag en main.py):
#   python main.py inputs/inputParams.wsm_orenstein.cfg -cmd   -> [cmd],[laser]
#   python main.py inputs/inputParams.wsm_orenstein.cfg -xtp   -> [xtp] (chi^(2))
# Salidas: outputs/wsm_orenstein/cmd y outputs/wsm_orenstein/xtp.
#   python qxti/graphics/graphics.py inputs/inputParams.wsm_orenstein.cfg
# =============================================================================

[hamiltonian]
source_file = wsm_orenstein.py
function_name = H
# Parametros (paper Fig. 4d): t=0.8 eV=0.0294 a.u., Delta=0.5, mz=5, my=1.
t = 0.0294
my = 1.0
mz = 5.0
Delta = 0.5
a = 1.0

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -3.14159
k_max = 3.14159
nk_path = 301
mesh_points = 81

[kgrid]
# 3D de 4 bandas. Grid denso para resolver mejor la respuesta del WSM.
# El guard automatico evita la linea de degeneracion ky=kz=0 y los nodos de
# Weyl (ver models/wsm_orenstein.py).
dimension = 3
k_points = [121, 121, 121]
shifted = true

[timegrid]
# Ancho de banda ~0.76 a.u. (mz=5): el integrador exponencial es exacto en banda.
dt = 0.8
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
# Transiciones de Weyl de baja energia (THz/IR lejano). omega << ancho de banda.
omega = 0.01
E0 = 0.0003
ellip = 0.0
ncycles = 8.0
cep = 0.0
t0 = 0.0
# Irradiacion del plano (112): la normal del plano de polarizacion (zdir) apunta
# a lo largo de [1,1,2]. phix queda LIBRE para rotar la elipse dentro del (112).
#   thetaz = arccos(2/sqrt6) = 35.2644 deg ; phiz = pi/4 = 45 deg.
phix = 0.0
thetaz = 0.6154797086703873
phiz = 0.7853981633974483
envname = gauss

# ─── Modo -cmd ───────────────────────────────────────────────────────────────
[cmd]
# response_method: pfddm(=theory,mesh) | ptddm(=simulation,CMD) | tddm(full non-pert.) | both | all
response_method = pfddm
enabled = true
max_order = 7
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
# tddm time integrator (velocity-gauge von Neumann): cfm2 (unitary, DEFAULT) | rkf45 | ab2  -- see docs/INTEGRATORS.md
tddm_propagator = cfm2
save_frequency_domain = false
n_workers = 0

# ─── Modo -xtp: tensor chi^(2) (SHG, las componentes del paper chi_zzz, chi_xzx) ─
[xtp]
# susceptibility_method: simulation | theory (orden 2 grid-based, rapido) | both.
susceptibility_method = pfddm
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1
susceptibility_enabled = true
# Ordenes 1 y 2 (chi^(1) y chi^(2)=SHG).
susceptibility_orders = [1,2]
# El paper grafica hasta ~3 eV. 0.011 a.u.=0.3 eV, 0.110 a.u.=3.0 eV.
susceptibility_omega_min = 0.0011
susceptibility_omega_max = 0.110
susceptibility_num_frequencies = 200
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14

# --- Solver del barrido (antes en la seccion [susceptibility_solver], ahora
#     PARTE de [xtp]). Construye rho^(s) en memoria para chi/sigma; el barrido
#     en frecuencia se configura con las claves susceptibility_* de arriba.
#     max_order debe ser >= max(susceptibility_orders). ---
max_order = 2
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00

# ─── Modo -ldos: densidad de estados g(E), PDOS y funcion espectral A(k,E) ───
[ldos]
# Todas las entradas de [ldos] usan unidades atomicas: E en Hartree y k en 1/Bohr.
# WSM 4x4: pseudogap por los nodos de Weyl; rompe inversion.
# Modos disponibles:
#   eigenvalues = bulk periodico: DOS/PDOS y A(k,E)
#   surface     = semi-infinito por una direccion (Lopez-Sancho).
#                 surface_side=both da las DOS caras a la vez (p.ej.
#                 TODOS los arcos de Fermi de un WSM, o ambos bordes en 2D).
#   finite      = placa finita en dos direcciones: sin buen k; devuelve
#                 DOS finita, espectro finito y LDOS(r,E)
enabled = true
# method: eigenvalues (diagonaliza H(k) y ensancha; = traza de Green -Im Tr G/pi).
method = surface
# broadening: lorentzian (DOS de Green exacto; metales/semimetales) |
#             gaussian (AISLANTES con gap: evita que las colas ~1/d^2 lo rellenen).
broadening = lorentzian
# eta = 0 -> automatico (unos pocos pasos de la malla de energia). >0 fija el ancho (a.u.).
# Estados de superficie / arco: eta pequeno y FIJO (nitido pero VISIBLE en eV).
# 5e-4 a.u. ~ 0.014 eV -> lineas de superficie finas pero no invisibles.
eta = 5.0e-5

# --- Estados de SUPERFICIE / BORDE (pon method = surface arriba) ---
# Hace el cristal semi-infinito en una direccion (decimacion de Lopez-Sancho) y
# calcula la funcion de Green de superficie -> revela estados de SUPERFICIE (3D)
# o de BORDE (2D, p.ej. el modo quiral de Haldane) en el gap proyectado del bulk.
# El momento de la superficie son las direcciones NO normales; el camino/plano
# espectral se interpretan en ese sub-espacio.
surface_max_iter     = 200       # iteraciones de la decimacion de Sancho
surface_tol          = 1.0e-8
# La LDOS de superficie integrada sobre la BZ de superficie 2D (3D) es MUY CARA
# (integra Sancho sobre 100x100 puntos). El LDOS de paper aqui es el mapa E-k y
# el corte kx-ky, que NO la necesitan -> DESACTIVADA para que corra rapido.
surface_ldos_enabled = false
surface_side = top
## Para este modelo de Orenstein, la cara z es la "buena" para ver la estructura
## completa de arcos de Fermi: la proyeccion superficial queda en (kx, ky) y los
## cuatro nodos no se colapsan por proyeccion.
surface_normal      = y
surface_kn_points   = 300

# --- Placa finita 2D (pon method = finite arriba; actualmente 2D Haldane) ---
finite_nx = 24
finite_ny = 24
finite_edge_cells = 1
finite_ldos_energy = 0.0

# --- Eje / ventana de energia (a.u.) ---
# Vacias e_min/e_max -> auto desde los extremos de banda. Fijarlas acota el EJE
# de energia de TODAS las graficas (DOS, PDOS y mapas espectrales).
# Zoom a la region de los nodos de Weyl (E~0): los estados de superficie viven
# en ~[-0.7, +0.7] eV; +-0.06 a.u. (+-1.6 eV) enmarca el gap proyectado + el arco.
e_min = -0.04593665272
e_max =  0.04593665272
num_energies = 600

# --- PDOS proyectada por orbital/subred: requiere el barrido 100x100 (caro), no
#     hace falta para el mapa E-k ni el corte de arcos -> desactivada aqui. ---
projected = true
fermi_level = 0.0          # nivel de Fermi (a.u.): linea de referencia

# --- Funcion espectral A(k,E), modo 1: E vs k ---
# El camino se define (prioridad arriba->abajo):
#   (a) spectral_path: vertices de alta simetria (multi-segmento) + etiquetas;
#   (b) spectral_k0/spectral_k1: un unico segmento recto;
#   (c) por defecto: linea recta a lo largo de kx cruzando la caja de la BZ.
# OJO: el camino NO se recorta a la caja; H(k) es periodico, asi que puede pasar
# por las esquinas REALES de la BZ (p.ej. los puntos de Dirac K, fuera de la caja).
# Todas esas coordenadas van en a.u.; el grafico las convierte a 1/Ang.
spectral_enabled = true
# LDOS de superficie E-k: camino a lo largo de kx a ky = 0.464 (la fila de nodos
# de Weyl proyectados en kx = +-1.677). Asi el mapa muestra los conos de bulk
# proyectados cerrandose en los nodos y el estado de SUPERFICIE (arco) a E ~ 0.
# (El camino por defecto va a ky=0 y NO cruzaria los nodos.)
spectral_axis        = kx
spectral_axis_origin = 0.0, 0.464, 0.0
spectral_axis_start  = 0.35
spectral_axis_end    =  5.65
spectral_num_k       = 500
# Alternativa de un solo segmento (si no usas spectral_path):
# spectral_k0 = -0.5, 0.0, 0.0
# spectral_k1 =  0.5, 0.0, 0.0

# --- Funcion espectral, modo 2: kx-ky a energia fija (corte tipo Fermi) ---
spectral_plane_enabled = true
# Para ver arcos de Fermi, usa el corte exactamente en el nivel de Fermi.
spectral_plane_energy = 0.0
spectral_plane_ky  = 0.0
# Ventana del plano (a.u.). Vacias -> auto desde la caja de la BZ.
# spectral_plane_kx_min = -1.3
# spectral_plane_kx_max =  1.3
# spectral_plane_ky_min = -1.3
# spectral_plane_ky_max =  1.3
spectral_plane_nkx = 100
spectral_plane_nkz = 100

# --- Estilo de los mapas espectrales (como el ejemplo original) ---
spectral_cmap       = Blues      # cualquier colormap de matplotlib
spectral_log_scale  = true       # log10 del peso espectral
spectral_log_vmin   = 0.0        # piso: suprime el fondo debil (A<1) -> mas limpio
spectral_log_vmax   = 2.6        # satura los estados de superficie (que resalten)
spectral_alpha_min  = 0.0        # transparencia lineal (0=transparente)
spectral_alpha_max  = 1.0

# --- Salida de figuras (siempre en eV vs 1/Ang) ---
plot_dpi = 300
