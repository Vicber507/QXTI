# =============================================================================
# INPUT UNIFICADO: modelo de Haldane en una escala grafeno-realista para HHG.
# Base usada en todo el modelo:
#   a0 = 2.46 Ang = 4.6487 a.u.
#   t1 = 2.7 eV  = 0.09922 a.u.
#   t2 = 0.30 eV = 0.01102 a.u.
#
# Ventana topologica para estos valores:
#   |M0| < 3*sqrt(3)*t2*|sin(phi0)| = 0.05729*|sin(phi0)|  [a.u.]
# En particular, para phi0 = pi/2:  |M0| < 0.05729 a.u.
#
# Aqui dejamos el caso centrado y topologico por defecto:
#   phi0 = pi/2, M0 = 0
#
# Margenes practicos para barrer:
#   phi0 ~ [0, pi]
#   M0   ~ [-0.08, 0.08] a.u.
#
# Un solo archivo, tres modos (flag en main.py):
#   python main.py inputs/inputParams.haldane_topological.cfg -cmd   -> [cmd],[laser]
#   python main.py inputs/inputParams.haldane_topological.cfg -xtp   -> [xtp]
#   python main.py inputs/inputParams.haldane_topological.cfg -ldos  -> [ldos]
# Salidas: outputs/haldane_topological/{cmd,xtp,ldos}.
#   python qxti/graphics/graphics.py inputs/inputParams.haldane_topological.cfg
# =============================================================================

[hamiltonian]
source_file = haldane.py
t1 = 0.09922316987426848
t2 = 0.011024796652696497
phi0 = 1.5707963268
M0 = 0.0
a0 = 4.648726266579395

[hamiltonian_plots]
path_type = kx
plane = kx_ky
k_min = -0.60
k_max = 0.60
mesh_points = 81

[kgrid]
# shifted = true: Monkhorst-Pack desplazado, evita los puntos de Dirac.
dimension = 2
k_points = [81, 81]
shifted = true

[timegrid]
dt = 0.08
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
omega = 0.09
E0 = 0.00035
ellip = 0.0
ncycles = 10.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

# ─── Modo -cmd ───────────────────────────────────────────────────────────────
[cmd]
# response_method: simulation | theory | both. Timer con ETA.
response_method = theory
enabled = true
max_order = 3
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
dataset_time_stride = 64
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
n_workers = 0

# ─── Modo -xtp ───────────────────────────────────────────────────────────────
[xtp]
# susceptibility_method: simulation | theory | both.
susceptibility_method = theory
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
susceptibility_enabled = true
susceptibility_orders = [1]
# 0.005 a.u.=0.136 eV (bajo gap) a 0.180 a.u.=4.898 eV (sobre gap).
susceptibility_omega_min = 0.005
susceptibility_omega_max = 0.180
susceptibility_num_frequencies = 61
susceptibility_n_workers = 0
susceptibility_eps = 1.0e-14

# --- Solver del barrido (antes en la seccion [susceptibility_solver], ahora
#     PARTE de [xtp]). Construye rho^(s) en memoria para chi/sigma; el barrido
#     en frecuencia se configura con las claves susceptibility_* de arriba.
#     max_order debe ser >= max(susceptibility_orders). ---
max_order = 1
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
n_workers = 0

[ldos]
# Todas las entradas de [ldos] usan unidades atomicas: E en Hartree y k en 1/Bohr.
# Modos disponibles:
#   eigenvalues = bulk periodico: DOS/PDOS y A(k,E)
#   surface     = semi-infinito por una direccion (Lopez-Sancho).
#                 surface_side=both da las DOS caras a la vez (p.ej.
#                 TODOS los arcos de Fermi de un WSM, o ambos bordes en 2D).
#   finite      = placa finita en dos direcciones: ya no hay buen k, asi que da
#                 DOS finita, espectro finito y LDOS(r,E)
enabled = true
method = surface

# --- Bulk periodico (se usa si method = eigenvalues) ---
broadening = lorentzian

# --- Superficie / borde semi-infinito (se usa si method = surface) ---
# Cara mostrada: bottom | top (UNA sola cara) | both (las dos a la vez).
# Sin esta linea, el default es 'both'. Para quitar el both, usa una sola cara:
surface_side = both
surface_max_iter = 400
surface_tol = 1.0e-8
surface_ldos_enabled = true
# Escala del plot dos_surface_bulk: contribucion superficial ~ g_surf / N_layers.
surface_compare_layers = 24

surface_normal = y
surface_kn_points = 200

# --- Placa finita 2D (se usa si method = finite) ---
finite_nx = 24
finite_ny = 24
finite_edge_cells = 1
finite_ldos_energy = 0.0

eta = 0.0004

# --- Ventana de energia (a.u.). Los graficos SIEMPRE salen en eV. ---
# Para conservar la misma calidad visual de los plots surface anteriores:
#   spectral_num_k = 400
#   num_energies   = 600
#   surface_kn_points = 200
e_min = -0.25
e_max =  0.25
num_energies = 600
fermi_level = 0.0
projected = true

# --- Camino en kx: K' -> K. El grafico sale en 1/Ang. ---
spectral_enabled = true
spectral_axis = kx
spectral_axis_start = -0.5202283407604866
spectral_axis_end = 0.5202283407604866
spectral_num_k = 400
spectral_plane_enabled = false

# --- Estilo general de salida ---
spectral_cmap       = Blues
spectral_log_scale  = true
spectral_log_vmin   = -1.5
spectral_log_vmax   = 3.3
spectral_alpha_min  = 0.0
spectral_alpha_max  = 1.0
plot_dpi = 300
