[hamiltonian]
# Modelo QWZ 2 bandas en red cuadrada: BZ = [-pi,pi]^2 EXACTA = caja muestreada.
# Validacion limpia teoria (Kubo analitico) vs simulacion (CMD time-domain).
source_file = square_2band.py

[kgrid]
dimension = 2
k_points = [21, 21]
shifted = true

[timegrid]
dt = 0.1
fft_window = hann
zero_padding = false
padding_factor = 1

[laser]
# omega = 0.3 a.u. < gap (1.02) -> respuesta dispersiva suave, sin resonancia.
omega = 3.0
E0 = 0.0001
ellip = 0.0
ncycles = 15.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[cmd]
response_method = theory
enabled = true
output_dir = outputs/qwz_theory_check
max_order = 1
population_time = 1.0e9
coherence_time = 220
temperature = 0.001
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
n_workers = 0
keep_rho_orders = true

[xtp]
bz_mask_enabled = false
