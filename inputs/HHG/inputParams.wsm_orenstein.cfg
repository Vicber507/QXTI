[hamiltonian]
# HHG para el WSM de Wu/Orenstein 2016 (modelo 4x4 con spin, 4 nodos de Weyl).
# Generar datos:
#   .venv/bin/python main.py inputParams.wsm_orenstein.cfg
# Graficar:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.wsm_orenstein.cfg
source_file = wsm_orenstein.py
function_name = H

# Parametros del modelo (paper Fig. 4d): t=0.8 eV, Delta=0.5, mz=5, my=1.
# t se da en atomic units (0.8 eV = 0.0294 a.u.); Delta rompe inversion.
t = 0.0294
my = 1.0
mz = 5.0
Delta = 0.5
a = 1.0

[hamiltonian_plots]
output_dir = outputs/wsm_orenstein
path_type = kx
plane = kx_ky
k_min = -3.14159
k_max = 3.14159
nk_path = 301
mesh_points = 81

[kgrid]
# Modelo 3D de 4 bandas -> Nk = Nx*Ny*Nz crece rapido; se modesto.
dimension = 3
# Usa numero PAR de puntos con shifted: evita la linea de degeneracion en
# ky=0,kz=0 (ademas de los nodos de Weyl). Ver nota en models/wsm_orenstein.py.
k_points = [20, 20, 20]
shifted = true

[timegrid]
# El ancho de banda es ~0.76 a.u. (mz=5 da terminos grandes): dt << 2*pi/0.76 ~ 8.
# El integrador exponencial trata las oscilaciones de banda de forma exacta.
dt = 0.8
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
# Escala del modelo: t=0.8 eV. Las transiciones de Weyl relevantes son de baja
# energia (THz/IR lejano segun el paper). omega muy por debajo del ancho de banda.
omega = 0.01
E0 = 0.0003
ellip = 0.0
ncycles = 8.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[cmd]
# ─── MOTOR DE CALCULO ─────────────────────────────────────────────────────
# Elige como se calcula el espectro HHG:
#   simulation = CMD en el dominio del tiempo (exacto, no perturbativo, lento).
#   theory     = espectro perturbativo analitico (sigma^(1) lineal + picos
#                armonicos de orden <= max_order). Rapido; valido en regimen
#                perturbativo (campo debil).
#   both       = corre ambos y reporta el speedup. Util para ver donde la
#                teoria perturbativa deja de coincidir con la simulacion.
# Ambos motores muestran un timer con ETA.
response_method = simulation
enabled = true
output_dir = outputs/wsm_orenstein/cmd
max_order = 3
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
n_workers = 0

[xtp]
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1
