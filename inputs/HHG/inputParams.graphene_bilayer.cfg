[hamiltonian]
# First generate data only with:
#   .venv/bin/python main.py inputParams.graphene_bilayer.cfg
#
# Then generate plots from the saved data with:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.graphene_bilayer.cfg
#   .venv/bin/python qxti/graphics/plot_hamiltonian.py inputParams.graphene_bilayer.cfg
#   .venv/bin/python qxti/graphics/plot_response.py inputParams.graphene_bilayer.cfg
#   .venv/bin/python qxti/graphics/plot_harmonics.py inputParams.graphene_bilayer.cfg
#
# Susceptibility tensors now use a dedicated XTP frequency-sweep input:
#   .venv/bin/python main.py inputParams.graphene_bilayer.susceptibility.cfg
#   .venv/bin/python qxti/graphics/plot_susceptibility_tensor.py inputParams.graphene_bilayer.susceptibility.cfg
source_file = graphene_bilayer.py

# Parametros del modelo en atomic units.
stacking = AB
a0 = 4.6479
gamma0 = 0.11612765879227763
gamma1 = 0.014002219651108944
gamma3 = 0.013965470794151482
gamma4 = 0.005144821445127847
delta_prime = 0.0008084899416475189
u = 0.002800296934373094

[hamiltonian_plots]
# Optional numerical settings used by the scripts in qxti/graphics.
path_type = kx
plane = kx_ky
k_min = -0.30
k_max = 0.30
mesh_points = 81

[kgrid]
# All reciprocal-space quantities are in atomic units.
dimension = 2
# Number of k-points per reciprocal direction. Use [Nx, Ny] in 2D.
k_points = [101, 101]
# shifted = true -> grid Monkhorst-Pack desplazado: evita los puntos de Dirac
# y degeneraciones de banda (armonicos pares espurios) para cualquier N, sin
# costo extra. Recomendado para grafeno y modelos con puntos de toque de banda.
shifted = true

[timegrid]
# dt is in atomic units. The total time window is inferred from the laser pulse.
# dt must resolve the fastest intrinsic timescale of the problem, not only the laser.
# A practical rule is:
#   dt << 2*pi / max(|E_n(k)-E_m(k)|)
# over the k-region that matters for the dynamics.
# Fast/tight-binding models usually need smaller dt than soft low-energy models.
dt = 0.3
fft_window = hann
zero_padding = true
padding_factor = 2

[laser]
# Single-pulse laser definition.
# Units:
#   omega, E0, t0, blaser, alaser: atomic units
#   cep, phix, thetaz, phiz: radians
#   ellip, ncycles, ncycles_clipped: dimensionless
#
# Convention copied from the reference implementation:
#   - envname = gauss        -> ncycles = number of cycles per FWHM
#   - envname = cos4         -> ncycles = number of cycles in the pulse duration
#   - clipped variants add a flat plateau controlled by ncycles_clipped
#   - the propagation direction is set by (thetaz, phiz)
#   - the in-plane major axis is rotated by phix
#
# Standard 2D in-plane x-polarized pulse:
#   thetaz = 0.0
#   phiz   = 0.0
#   phix   = 0.0
#
# Standard 2D in-plane y-polarized pulse:
#   thetaz = 0.0
#   phiz   = 0.0
#   phix   = 1.5707963267948966
omega = 0.061
E0 = 0.000049
ellip = 0.0
ncycles = 12.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[cmd]
# ─── MOTOR DE CALCULO ─────────────────────────────────────────────────────
# Elige como se calcula el espectro HHG:
#   simulation = CMD en el dominio del tiempo (exacto, no perturbativo, lento).
#   theory     = espectro perturbativo analitico (sigma^(1) lineal + picos
#                armonicos de orden <= max_order). Rapido; valido en regimen
#                perturbativo (campo debil).
#   both       = corre ambos y reporta el speedup. Util para ver donde la
#                teoria perturbativa deja de coincidir con la simulacion.
# Ambos motores muestran un timer con ETA.
response_method = simulation
enabled = true
output_dir = outputs/cmd_graphene_bilayer
max_order = 3
keep_rho_orders = false
# Guardado rapido y mas ligero en disco:
# complex64 suele reducir el tamano casi a la mitad y acelera bastante la escritura.
rho_storage_dtype = complex64
# Dtype del scratch temporal cuando keep_rho_orders = false.
# auto activa float16_complex en modo "solo observables", lo que reduce aun mas
# el peso del scratch sin afectar los archivos compactos finales.
scratch_rho_storage_dtype = auto
# Submuestreo temporal para los datasets compactos de plots.
# Con este pulso Nt es muy grande; guardar 1 de cada 64 tiempos evita
# que la coherencia kx-ky intente materializar varios GiB innecesarios.
dataset_time_stride = 64
# Si estan en false, no se calculan ni se guardan los datasets compactos
# de poblacion/coherencia, y luego tampoco habra plots de esas familias.
save_population_dataset = false
save_coherence_dataset = false
# Si esta en false, no se calcula ni se guarda current_spectrum.npz.
save_xtp_dataset = false
# Population and coherence relaxation times in atomic units.
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
# RKF45 is adaptive. A slightly looser tolerance plus a less conservative
# step controller makes it faster on long pulses while still controlling error.
# Set solver_max_iterations = 0 to disable the global iteration cap and let the
# solver continue as long as it keeps making progress.
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_max_rejections = 20000
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
# Parallel k-loop: 0 = use all available CPU cores automatically.
# The FFT time propagator + threading gives ~25x speedup vs original serial loop.
n_workers = 0

[xtp]
# Optional Brillouin-zone mask used only when integrating macroscopic
# observables such as P(t) and J(t) from the saved rho^(s).
# All reciprocal-space lengths are in atomic units.
#
# If enabled:
# - outside the chosen circular mask radius the weight is exactly zero
# - inside the radius the weight is a broad Gaussian centered at k = 0
#
# radius_percent is measured relative to the reciprocal cutoff built from
# the lattice, i.e. the reference scale is min(pi / a_i).
# sigma is the Gaussian width in reciprocal atomic units.
bz_mask_enabled = false
bz_mask_radius_percent = 80
bz_mask_sigma = 0.5
