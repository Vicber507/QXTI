[hamiltonian]
# Semimetal de Weyl de dos bandas (cuatro nodos de Weyl), modelo 3D tipo TaAs.
# Generar datos:
#   .venv/bin/python main.py inputParams.wsm.cfg
# Graficar:
#   .venv/bin/python qxti/graphics/graphics.py inputParams.wsm.cfg
#   .venv/bin/python qxti/graphics/plot_harmonics.py inputParams.wsm.cfg
source_file = wsm_two_weyl.py
function_name = H

# Parametros del modelo en atomic units (puedes sobreescribir los defaults).
# gamma = tilt de los conos; tx,ty,tz = hoppings; M0 = masa.
gamma = 0.0
tx = 0.0041
ty = 0.0082
tz = 0.0082
M0 = 0.0164
# kw (posicion del nodo de Weyl) se calcula como pi/(2 a0) si no se da.

[hamiltonian_plots]
output_dir = outputs/wsm
path_type = kx
plane = kx_kz
k_min = -0.45
k_max = 0.45
nk_path = 301
mesh_points = 81

[kgrid]
# Modelo 3D -> grid 3D. Nk = Nx*Ny*Nz crece rapido; se modesto.
dimension = 3
k_points = [15, 15, 15]
# shifted = true es IMPRESCINDIBLE aqui: los 4 nodos de Weyl son puntos de
# toque de banda (gap=0). Un punto del grid que caiga sobre un nodo hace
# singular la conexion de Berry y genera armonicos espurios (igual que los
# puntos de Dirac del grafeno). El grid Monkhorst-Pack desplazado los evita.
shifted = true

[timegrid]
# dt debe resolver el ancho de banda (~0.08 a.u.): dt << 2*pi/0.08 ~ 78.
# El integrador exponencial trata las oscilaciones de banda de forma exacta,
# asi que dt=2.0 (39 puntos por periodo de banda) es holgado y reduce Nt.
dt = 1.0
fft_window = blackman
zero_padding = true
padding_factor = 4

[laser]
# Escalas del WSM: hoppings ~0.008, gap maximo ~0.08 a.u.
# omega muy por debajo del ancho de banda. Campo debil (regimen perturbativo):
# gamma_pert ~ E0*a0/omega ~ 0.1 con estos valores.
omega = 0.008
E0 = 0.00013
ellip = 0.0
ncycles = 8.0
cep = 0.0
t0 = 0.0
phix = 0.0
thetaz = 0.0
phiz = 0.0
envname = gauss

[cmd]
enabled = true
output_dir = outputs/wsm/cmd
max_order = 3
keep_rho_orders = false
rho_storage_dtype = complex64
scratch_rho_storage_dtype = auto
save_population_dataset = false
save_coherence_dataset = false
save_xtp_dataset = true
population_time = 110
coherence_time = 220
temperature = 0.02
fermi_level = 0.0
distribution = valence_occupation
basis = band
gauge = length
include_intraband = true
include_interband = true
include_dephasing = true
solver = rkf45
solver_tolerance = 2.0e-3
solver_max_iterations = 0
solver_h_min = 1.0e-12
solver_safety_factor = 0.90
solver_min_factor = 0.20
solver_max_factor = 6.00
save_frequency_domain = false
# Parallel k-loop: 0 = todos los nucleos automaticamente.
n_workers = 0

[xtp]
bz_mask_enabled = false
bz_mask_radius_percent = 100.0
bz_mask_sigma = 0.1
